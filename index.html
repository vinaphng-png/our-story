<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Our Story 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&family=Caveat:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --rose:#c9637a;
  --rose-light:#f5e0e5;
  --rose-dark:#8b3a4e;
  --cream:#fdf6f0;
  --warm:#f2e8df;
  --paper:#fffdf7;
  --text:#2d2020;
  --muted:#7a5c62;
  --gold:#c4956a;
  --white:#fff;
  --shadow:0 8px 40px rgba(180,80,100,.13);
  --ink:#3a2a2a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--cream);
  font-family:'DM Sans',sans-serif;
  color:var(--text);
  min-height:100vh;
}

/* HEADER */

header{
  text-align:center;
  padding:3rem 1rem 1.5rem;
}

.heart-deco{
  font-size:1.2rem;
  letter-spacing:8px;
  color:var(--rose);
  opacity:.5;
  margin-bottom:.5rem;
  display:block;
}

header h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(1.8rem,4vw,3rem);
  font-weight:400;
  color:var(--rose-dark);
}

header h1 em{
  color:var(--rose);
}

header p{
  margin-top:.5rem;
  font-size:.85rem;
  color:var(--muted);
  letter-spacing:2px;
  text-transform:uppercase;
}

.divider{
  width:50px;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--rose),transparent);
  margin:1rem auto;
}

/* LAYOUT */

.container{
  max-width:1140px;
  margin:auto;
  padding:0 1.5rem 4rem;
  display:grid;
  grid-template-columns:1fr 340px;
  gap:2rem;
}

@media(max-width:820px){
  .container{
    grid-template-columns:1fr;
  }
}

/* MAIN CARD */

.slideshow-card,
.panel,
.love-counter{
  background:var(--white);
  border-radius:24px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

/* VIEWPORT */

.slide-viewport{
  position:relative;
  width:100%;
  aspect-ratio:4/3;
  overflow:hidden;
  background:var(--warm);
}

.slide-img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.slide-img.active{
  display:block;
  animation:fade .5s ease;
}

@keyframes fade{
  from{
    opacity:0;
    transform:scale(1.03);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.no-photo{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:1rem;
  color:var(--muted);
}

.slide-controls{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:100%;
  display:flex;
  justify-content:space-between;
  padding:0 12px;
}

.slide-btn{
  width:40px;
  height:40px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.85);
  cursor:pointer;
  font-size:1.2rem;
}

.slide-counter{
  position:absolute;
  right:12px;
  bottom:10px;
  background:rgba(0,0,0,.35);
  color:#fff;
  font-size:.75rem;
  padding:3px 10px;
  border-radius:20px;
}

/* INFO */

.slide-info{
  padding:1rem 1.4rem;
  border-bottom:1px solid var(--rose-light);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.slide-caption{
  font-family:'Playfair Display',serif;
  color:var(--rose-dark);
  font-size:1.1rem;
}

.slide-date{
  color:var(--gold);
  font-size:.75rem;
  margin-bottom:4px;
}

/* DIARY */

.diary-section{
  padding:1.2rem 1.4rem 1.5rem;
}

.diary-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:1rem;
}

.diary-title{
  font-family:'Playfair Display',serif;
  color:var(--rose-dark);
}

.diary-count{
  font-size:.75rem;
  color:var(--muted);
}

.diary-entries{
  display:flex;
  flex-direction:column;
  gap:1rem;
  margin-bottom:1rem;
  max-height:260px;
  overflow-y:auto;
}

.diary-entry{
  position:relative;
  padding-left:1.4rem;
  border-left:2px solid var(--rose-light);
}

.diary-dot{
  position:absolute;
  left:-6px;
  top:6px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--rose);
}

.diary-entry-date{
  font-size:.7rem;
  color:var(--gold);
}

.diary-entry-author{
  font-size:.75rem;
  color:var(--muted);
  margin:.2rem 0;
}

.diary-entry-text{
  font-family:'Caveat',cursive;
  font-size:1.1rem;
  line-height:1.5;
}

.diary-form{
  background:var(--paper);
  border:1px solid #f0ddd8;
  border-radius:14px;
  padding:1rem;
  display:flex;
  flex-direction:column;
  gap:.7rem;
}

.diary-form input,
.diary-form textarea{
  border:none;
  border-bottom:1px dashed #e8d5d9;
  background:none;
  padding:.4rem 0;
  font-family:inherit;
  outline:none;
}

.diary-form textarea{
  min-height:80px;
  resize:none;
  font-family:'Caveat',cursive;
  font-size:1.1rem;
}

.btn-diary{
  align-self:flex-end;
  background:var(--rose);
  color:#fff;
  border:none;
  border-radius:20px;
  padding:.5rem 1.2rem;
  cursor:pointer;
}

/* SIDEBAR */

.sidebar{
  display:flex;
  flex-direction:column;
  gap:1.5rem;
}

.panel-header{
  padding:1rem 1.2rem;
  border-bottom:1px solid var(--rose-light);
}

.panel-title{
  font-family:'Playfair Display',serif;
  color:var(--rose-dark);
}

.panel-body{
  padding:1rem 1.2rem;
}

/* UPLOAD */

.upload-zone{
  border:1.5px dashed #e8c5cc;
  border-radius:10px;
  padding:1rem;
  text-align:center;
  cursor:pointer;
  color:var(--muted);
}

.upload-zone:hover{
  background:var(--rose-light);
}

#file-input{
  display:none;
}

.thumb-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:.8rem;
}

.thumb{
  aspect-ratio:1;
  overflow:hidden;
  border-radius:8px;
  cursor:pointer;
  border:2px solid transparent;
}

.thumb.active-thumb{
  border-color:var(--rose);
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* MUSIC */

.music-player{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:1rem;
}

.play-btn{
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:var(--rose);
  color:#fff;
  cursor:pointer;
}

.now-title{
  font-size:.9rem;
}

.now-artist{
  font-size:.75rem;
  color:var(--muted);
}

.track-list{
  display:flex;
  flex-direction:column;
  gap:5px;
  margin-top:1rem;
}

.track-item{
  padding:.5rem .6rem;
  border-radius:10px;
  cursor:pointer;
}

.track-item:hover{
  background:var(--rose-light);
}

.add-track{
  display:flex;
  flex-direction:column;
  gap:.5rem;
  margin-top:1rem;
}

.add-track input{
  border:1px solid #e8d5d9;
  border-radius:8px;
  padding:.5rem .7rem;
}

.btn-add-track{
  background:var(--rose);
  color:#fff;
  border:none;
  border-radius:20px;
  padding:.5rem 1rem;
  cursor:pointer;
}

/* LOVE COUNTER */

.love-counter{
  padding:1.5rem;
  text-align:center;
}

.lc-label{
  font-size:.8rem;
  color:var(--muted);
  margin-bottom:.5rem;
}

.lc-days{
  font-family:'Playfair Display',serif;
  font-size:3rem;
  color:var(--rose-dark);
}

.lc-days span{
  font-size:1rem;
  color:var(--rose);
}

.lc-sub{
  margin:.8rem 0 1rem;
  color:var(--muted);
  font-size:.85rem;
}

.lc-date-row{
  display:flex;
  gap:8px;
}

.lc-date-input{
  flex:1;
  border:1px solid #e8d5d9;
  border-radius:8px;
  padding:.5rem;
}

.lc-save-btn{
  background:var(--rose);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:.5rem .9rem;
  cursor:pointer;
}

::-webkit-scrollbar{
  width:4px;
}

::-webkit-scrollbar-thumb{
  background:#e8c5cc;
  border-radius:4px;
}
</style>
</head>

<body>

<header>
  <span class="heart-deco">♡ ♡ ♡</span>
  <h1>Our <em>Love Story</em></h1>
  <p>Những khoảnh khắc đáng nhớ của chúng mình</p>
  <div class="divider"></div>
</header>

<div class="container">

  <!-- LEFT -->

  <div>

    <div class="slideshow-card">

      <div class="slide-viewport" id="viewport">

        <div class="no-photo" id="no-photo">
          <p>Hãy thêm ảnh của hai bạn 💕</p>
        </div>

        <div class="slide-controls">
          <button class="slide-btn" onclick="prevSlide()">‹</button>
          <button class="slide-btn" onclick="nextSlide()">›</button>
        </div>

        <div class="slide-counter" id="counter">0 / 0</div>

      </div>

      <div class="slide-info">
        <div>
          <div class="slide-date" id="slide-date"></div>
          <div class="slide-caption" id="slide-caption"></div>
        </div>
      </div>

      <div class="diary-section">

        <div class="diary-header">
          <div class="diary-title">📖 Nhật ký</div>
          <div class="diary-count" id="diary-count">0 trang</div>
        </div>

        <div class="diary-entries" id="diary-entries">
        </div>

        <div class="diary-form">
          <input type="text" id="author-input" placeholder="Tên của bạn">
          <textarea id="diary-input" placeholder="Viết điều gì đó..."></textarea>
          <button class="btn-diary" onclick="addDiaryEntry()">Lưu 🌸</button>
        </div>

      </div>

    </div>

  </div>

  <!-- RIGHT -->

  <div class="sidebar">

    <div class="love-counter">
      <div class="lc-label">Chúng mình đã bên nhau</div>
      <div class="lc-days" id="love-days">0<span> ngày</span></div>
      <div class="lc-sub">💕</div>

      <div class="lc-date-row">
        <input type="date" class="lc-date-input" id="love-date">
        <button class="lc-save-btn" onclick="saveLoveDate()">Lưu</button>
      </div>
    </div>

    <!-- PHOTO -->

    <div class="panel">

      <div class="panel-header">
        <div class="panel-title">📷 Ảnh</div>
      </div>

      <div class="panel-body">

        <div class="upload-zone" onclick="document.getElementById('file-input').click()">
          Tải ảnh lên
        </div>

        <input type="file" id="file-input" multiple accept="image/*">

        <div class="thumb-grid" id="thumb-grid"></div>

      </div>

    </div>

    <!-- MUSIC -->

    <div class="panel">

      <div class="panel-header">
        <div class="panel-title">🎵 Nhạc nền</div>
      </div>

      <div class="panel-body">

        <div class="music-player">
          <button class="play-btn" id="play-btn">▶</button>

          <div>
            <div class="now-title" id="now-title">Chưa chọn bài</div>
            <div class="now-artist" id="now-artist">—</div>
          </div>
        </div>

        <div class="track-list" id="track-list"></div>

        <div class="add-track">
          <input type="text" id="track-name" placeholder="Tên bài hát">
          <input type="text" id="track-artist" placeholder="Ca sĩ">
          <input type="text" id="track-url" placeholder="Link mp3">
          <button class="btn-add-track" id="add-track-btn">+ Thêm bài</button>
        </div>

      </div>

    </div>

  </div>

</div>

<audio id="audio-player"></audio>

<script>

/* DATA */

let photos = [];
let current = 0;

let tracks = [];
let currentTrack = -1;

const audio = document.getElementById('audio-player');

/* PHOTO */

document.getElementById('file-input').addEventListener('change', handleUpload);

function handleUpload(e){

  Array.from(e.target.files).forEach(file=>{

    const reader = new FileReader();

    reader.onload = function(ev){

      photos.push({
        src:ev.target.result,
        caption:'♡ Khoảnh khắc của chúng mình',
        date:new Date().toLocaleDateString('vi-VN'),
        entries:[]
      });

      renderThumbs();
      goToSlide(photos.length-1);
    };

    reader.readAsDataURL(file);

  });

}

function renderThumbs(){

  const grid = document.getElementById('thumb-grid');

  grid.innerHTML = '';

  photos.forEach((p,i)=>{

    const div = document.createElement('div');

    div.className = 'thumb';

    if(i===current){
      div.classList.add('active-thumb');
    }

    div.innerHTML = `<img src="${p.src}">`;

    div.onclick = ()=>goToSlide(i);

    grid.appendChild(div);

  });

}

function goToSlide(i){

  current = i;

  renderSlide();
  renderThumbs();

}

function renderSlide(){

  const viewport = document.getElementById('viewport');

  viewport.querySelectorAll('.slide-img').forEach(el=>el.remove());

  if(!photos.length){

    document.getElementById('counter').textContent='0 / 0';

    return;
  }

  document.getElementById('no-photo').style.display='none';

  const img = document.createElement('img');

  img.src = photos[current].src;

  img.className = 'slide-img active';

  viewport.prepend(img);

  document.getElementById('counter').textContent =
    `${current+1} / ${photos.length}`;

  document.getElementById('slide-caption').textContent =
    photos[current].caption;

  document.getElementById('slide-date').textContent =
    photos[current].date;

  renderDiary();

}

function prevSlide(){

  if(!photos.length) return;

  current--;

  if(current<0){
    current=photos.length-1;
  }

  renderSlide();
  renderThumbs();

}

function nextSlide(){

  if(!photos.length) return;

  current++;

  if(current>=photos.length){
    current=0;
  }

  renderSlide();
  renderThumbs();

}

/* DIARY */

function addDiaryEntry(){

  if(!photos.length) return;

  const author = document.getElementById('author-input').value.trim();

  const text = document.getElementById('diary-input').value.trim();

  if(!text) return;

  photos[current].entries.push({
    author:author || 'Ẩn danh',
    text:text,
    date:new Date().toLocaleDateString('vi-VN')
  });

  document.getElementById('author-input').value='';
  document.getElementById('diary-input').value='';

  renderDiary();

}

function renderDiary(){

  const box = document.getElementById('diary-entries');

  box.innerHTML='';

  if(!photos.length) return;

  const entries = photos[current].entries;

  document.getElementById('diary-count').textContent =
    entries.length + ' trang';

  entries.forEach(e=>{

    const div = document.createElement('div');

    div.className='diary-entry';

    div.innerHTML = `
      <div class="diary-dot"></div>
      <div class="diary-entry-date">${e.date}</div>
      <div class="diary-entry-author">— ${e.author}</div>
      <div class="diary-entry-text">${e.text}</div>
    `;

    box.appendChild(div);

  });

}

/* MUSIC */

document.getElementById('add-track-btn').addEventListener('click', addTrack);

function addTrack(){

  const name = document.getElementById('track-name').value.trim();

  const artist = document.getElementById('track-artist').value.trim();

  const url = document.getElementById('track-url').value.trim();

  if(!name) return;

  tracks.push({
    name:name,
    artist:artist || 'Unknown',
    url:url
  });

  document.getElementById('track-name').value='';
  document.getElementById('track-artist').value='';
  document.getElementById('track-url').value='';

  renderTracks();

}

function renderTracks(){

  const list = document.getElementById('track-list');

  list.innerHTML='';

  tracks.forEach((t,i)=>{

    const div = document.createElement('div');

    div.className='track-item';

    div.innerHTML = `
      <div class="track-name">${t.name}</div>
      <div class="now-artist">${t.artist}</div>
    `;

    div.onclick = ()=>playTrack(i);

    list.appendChild(div);

  });

}

function playTrack(i){

  currentTrack=i;

  audio.src=tracks[i].url;

  document.getElementById('now-title').textContent=tracks[i].name;
  document.getElementById('now-artist').textContent=tracks[i].artist;

  audio.play();

  document.getElementById('play-btn').textContent='⏸';

}

document.getElementById('play-btn').addEventListener('click', ()=>{

  if(audio.paused){

    audio.play();

    document.getElementById('play-btn').textContent='⏸';

  }else{

    audio.pause();

    document.getElementById('play-btn').textContent='▶';

  }

});

/* LOVE DATE */

function saveLoveDate(){

  const val = document.getElementById('love-date').value;

  if(!val) return;

  localStorage.setItem('loveDate', val);

  updateLoveCounter();

}

function updateLoveCounter(){

  const val = localStorage.getItem('loveDate');

  if(!val) return;

  document.getElementById('love-date').value=val;

  const start = new Date(val);

  const now = new Date();

  const diff = now-start;

  const days = Math.floor(diff/86400000);

  document.getElementById('love-days').innerHTML =
    days + '<span> ngày</span>';

}

updateLoveCounter();

</script>

</body>
</html>
